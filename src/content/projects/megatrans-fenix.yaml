title: Megatrans · Fenix
order: 11
group: work

en:
  sector: "Logistics · Product discovery"
  years: "[year]"
  summary: "Discovery workshops across Megatrans to reset Fenix, its fleet management product: the real problems, one shared direction, first wireframes and an MVP roadmap."
  role: "Product discovery lead"
  timeline: "[year]"
  didLabel: "What I did"
  did:
    - "Discovery workshops with five areas"
    - "Problem identification"
    - "Objective alignment"
    - "Initial wireframes"
    - "MVP roadmap"
  results: "[What happened after the discovery, in one line.]"
  sections:
    - kicker: "Workshops"
      title: "Five areas, 124 points on the table."
      items:
        - "Customer service · post-sales: 24 points (standardization, centralization, integration, simplification)"
        - "Customer service · trip monitoring: 9 points"
        - "Customer service · alarm monitoring: 9 points"
        - "AySA account: 25 points (stability, scale, backlog bottlenecks)"
        - "Commercial: 57 points (usability first, shared processes, service quality, CRM)"
    - kicker: "Problems"
      title: "The product was limited by its own architecture."
      items:
        - "No shared code base and no UX foundation"
        - "Processes not standardized or integrated, inside and outside the company"
        - "No defined way of working, and new features built ad hoc"
        - "Too many billable concepts made billing heavy"
        - "Building to order for each client multiplied the fronts"
    - kicker: "Direction"
      title: "Fenix, always around fleet management."
      text: "A new frame for everyone: company processes defined, simplified and measured, an ERP for the business functions, and Fenix as a Megatrans business unit centered on fleet management. From there, the first wireframes and an MVP roadmap."

