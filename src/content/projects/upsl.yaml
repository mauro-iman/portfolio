    - kicker: "Context"
      title: "A fast-growing league, run on paper and text messages."
      text: "UPSL has more than 500 teams across North America. On the field it is professional; off the field, match-day operations still depended on printed rosters and photos of handwritten notes sent by text."
    - kicker: "A concept I proposed"
      title: "Match Day: from the locker room to the final whistle."
      text: "An offline-first app that digitizes match day, with a role for each person involved. Concept only; it was not built."
      items:
        - "The coach picks the lineup on the phone and gets a match-day QR code"
        - "League staff scan it and check each player’s face against their photo"
        - "The referee’s screen unlocks only after the roster is verified, then logs goals, subs and cards with one tap"
        - "A pilot run in parallel with paper before dropping it, with clear success metrics: scores online less than five minutes after the final whistle and no transcription errors"

