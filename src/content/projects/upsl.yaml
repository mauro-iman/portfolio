en:
  coverAlt: "Concept art for the Match Day app: a wireframe hand holding a phone with the UPSL crest, over a stadium in black and white"
  sector: "Sports · League operations"
  years: "2024–2025"
  summary: "Maintenance and evolution of the Registry System for Teams and Players of UPSL, a North American pro-development soccer league, leading a small team and the client relationship."
  role: "Product lead of the account · Independent consulting"
  timeline: "July 2024 – April 2025"
  didLabel: "What I did"
  did:
    - "Led a small product team"
    - "Point of contact with the client"
    - "Contracts and estimates"
