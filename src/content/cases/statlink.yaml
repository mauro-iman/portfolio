  story:
    title: Breaking the one-account, one-role logic.
    chapters:
      - kicker: Problem
        title: One person, one account, one role.
        text: In football the same person plays many parts — player, coach, scout, director. The platform tied each account to a single role, which pushed people into duplicate logins and fragmented data.
        data: → A crowded market led by WyScout and Opta Sports
      - kicker: Decision
        title: Design around people, not accounts.
        text: A SWOT analysis and seven personas, like “Marek the Director” and “John the Scout”, led to a new architecture — one unified account that holds several profiles, each with its own view.
        data: → Unified account — one credential, multiple profiles
      - kicker: Result
        title: One login for every role in the club.
        text: Teams, players and staff live in one coherent structure, built on a dark design system made for analysis-heavy screens.
        data: → Partnership with Iterpro · [impact metric]
