  problem: Cada cuenta era una persona con un solo rol, así que un entrenador que también hacía scouting, o un director con varios equipos, necesitaba logins separados.
  did: Análisis competitivo frente a WyScout y Opta, siete personas, una arquitectura de información multiperfil y un design system atómico oscuro, además de rituales ágiles para el equipo.
  result: Un modelo de cuenta unificada — una credencial, varios perfiles — y un producto listo para la alianza con Iterpro.
  story:
    title: Romper la lógica de una cuenta, un rol.
    chapters:
      - kicker: Problema
        title: Una persona, una cuenta, un rol.
        text: En el fútbol la misma persona cumple muchos papeles — jugador, entrenador, scout, director. La plataforma ataba cada cuenta a un solo rol, lo que llevaba a logins duplicados y datos fragmentados.
        data: → Un mercado competido, liderado por WyScout y Opta Sports
      - kicker: Decisión
        title: Diseñar alrededor de las personas, no de las cuentas.
        text: Un análisis FODA y siete personas, como “Marek el Director” y “John el Scout”, llevaron a una nueva arquitectura — una cuenta unificada que reúne varios perfiles, cada uno con su propia vista.
        data: → Cuenta unificada — una credencial, varios perfiles
      - kicker: Resultado
        title: Un solo login para cada rol del club.
        text: Equipos, jugadores y staff conviven en una estructura coherente, sobre un design system oscuro pensado para pantallas de análisis.
        data: → Alianza con Iterpro · [métrica de impacto]
  work:
    title: Tres movimientos, una plataforma.
