      - mini: q
        title: Arquitectura multipersona
        text: Siete personas y el modelo de cuenta unificada — perfiles de equipo y de jugador con estadísticas, plantel, suscripción y tarjetas de evaluación.
        screen: "[pantalla: perfil de equipo]"
      - mini: sys
