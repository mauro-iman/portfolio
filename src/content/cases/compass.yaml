en:
  sector: PropTech
  years: 2024–2025
  summary: "Design at the scale of a $17B company built on acquisitions: compliance operations, CRM research and a design system that absorbs new brands."
  homeMetricLabel: saved per year
  highlight: "$400k saved per year · 2× faster brand integrations"
  role: Senior product designer (lead individual contributor)
  scope: Contract automation · Compliance tools · CRM research · Design system
  team: Transaction Operations, Brokers of Record, product and engineering
  timeline: Early 2024 – Late 2025
  coverAlt: Compass product cover
  metrics:
    - { value: "$400k", label: annual savings from the contract renewal workflow }
    - { value: "4.8/5", label: UX satisfaction for the compliance checklist tool }
    - { value: "2×", label: faster brand integrations with the multi-brand system }
  problem: Every acquisition, from Christie’s to @properties, brought its own tools, brands and compliance steps, and routine changes waited on engineering.
  did: Automated contract renewals, researched how agents work on behalf of others, rebuilt the compliance checklist tool as self-service and built one design system for every brand.
  result: "$400k saved a year, routine compliance updates with no engineering involved, and new brands integrated twice as fast."
  story:
    title: From scattered to aligned.
    chapters:
      - kicker: Problem
        title: Growth by acquisition, one product at a time.
        text: Christie’s, @properties and Washington Fine Properties each arrived with their own tools, brands and compliance steps. Operations scaled; the experience fragmented, and every routine compliance change needed an engineer.
        data: → A $17B company built on acquisitions
      - kicker: Decision
        title: Fix the shared foundations, not every screen.
        text: Instead of redesigning product by product, I focused on what every brand shares — the contract workflow, the compliance rules behind each transaction and one design system as the single source of truth.
        data: → One system for every brand, with design system office hours for the teams
      - kicker: Result
        title: New brands snap into place.
        text: Renewals run without manual chasing, compliance teams update their own checklists, and each acquisition joins the system instead of adding to the noise.
        data: → $400k saved per year · 100% of routine compliance updates without engineering
  work:
    title: Four initiatives, one direction.
    items:
      - mini: q
        title: Contract service automation
        text: Redesigned the contract renewal workflow for the Transaction Operations team, turning manual follow-ups into an automated service that saves $400k a year.
        screen: "[screen: contract renewal workflow]"
      - mini: notes
        title: CRM “On behalf of” research
        text: Research with 14 participants on how assistants and teams act for agents inside the CRM. The findings shaped the roadmap for a multichannel inbox.
        screen: "[image: research synthesis]"
      - mini: q
        title: Checklist Admin Tool v2
        text: Rebuilt a legacy tool for Brokers of Record as self-service, with dynamic filters, bulk editing and a full checklist item editor. UX satisfaction 4.8/5.
        screen: "[screen: checklist item editor]"
      - mini: sys
        title: Multi-brand design system
        text: Figma variables and tokens as a single source of truth, so a new brand re-skins the product instead of rebuilding it. Brand integrations became twice as fast.
        screen: "[image: system components]"
  reflection: "[What this project taught me, in one or two sentences.]"
  next: "[one line]"
  demo:
    c.try: Try it
    c.try.h: One system, any brand.
    c.try.p: Pick a brand. The same components take its color, shape and weight.
    c.b1: Brand A
    c.b2: Brand B
    c.b3: Brand C
    c.bd.home: Listings
    c.bd.r1: Review documents
    c.bd.r2: Client follow-up
    c.bd.r3: Disclosure signed
    c.bd.t1: Pending
    c.bd.t2: Today
    c.bd.t3: Done
