    c.bd.r2: Client follow-up
    c.bd.r3: Disclosure signed
    c.bd.t1: Pending
    c.bd.t2: Today
    c.bd.t3: Done
    c.bd.in: Search clients
    c.bd.btn: New listing
    c.bd.note: Illustrative demo, not the real product.
    c.bd.live: applied

es:
  sector: PropTech
  years: 2024–2025
  summary: "Diseño a la escala de una empresa de USD 17B que crece por adquisiciones: operaciones de compliance, research de CRM y un design system existente extendido para absorber marcas nuevas."
  homeMetricLabel: de ahorro por año
  highlight: "USD 400k de ahorro anual · integración de marcas 2× más rápida"
  role: Senior product designer (lead individual contributor)
  scope: Renovación de contratos · Herramientas de compliance · Research de CRM · Design system
  team: Transaction Operations, Brokers of Record, producto e ingeniería
  timeline: Principios de 2024 – fines de 2025
  coverAlt: Portada del producto Compass
  metrics:
    - { value: "$400k", label: de ahorro anual con el flujo de renovación de contratos }
    - { value: "4.8/5", label: de satisfacción UX con la herramienta de checklists de compliance }
    - { value: "2×", label: más rápida la integración de marcas con el sistema multimarca }
  problem: Cada adquisición, de Christie’s a @properties, sumaba una marca que el design system no estaba preparado para soportar, mientras los flujos de contratos y compliance tenían cuellos de botella y pasos innecesarios, y los cambios de rutina dependían de ingeniería.
  did: Simplifiqué la renovación de contratos, investigué cómo el personal administrativo actúa en nombre de los agentes dentro del CRM, convertí la herramienta de checklists de compliance en autoservicio y extendí el design system existente para que soporte todas las marcas.
  result: "USD 400k de ahorro por año al acortar la ventana de renovación, cambios de compliance de rutina sin pasar por ingeniería y marcas nuevas integradas el doble de rápido."
  story:
    title: Del caos al orden.
    chapters:
      - kicker: Problema
        title: La operación creció más rápido que sus bases.
        text: Christie’s, @properties y Washington Fine Properties trajeron más agentes, más operaciones y una marca nueva. La infraestructura detrás no estaba pensada para esa escala, así que cada adquisición sumaba fricción.
        data: → Una empresa de USD 17B construida a base de adquisiciones
      - kicker: Decisión
        title: Arreglar las bases compartidas, no cada pantalla.
        text: En lugar de emparchar producto por producto, trabajé sobre lo que usan todas las marcas y todas las operaciones, para que crecer dejara de costar más esfuerzo.
        data: → Cuatro iniciativas sobre las mismas bases
      - kicker: Resultado
        title: Crecer dejó de generar fricción.
        text: Las marcas nuevas se suman al sistema, las renovaciones se cierran a tiempo y los equipos de compliance trabajan sin esperar a ingeniería.
        data: → USD 400k de ahorro por año · 100% de los cambios de compliance de rutina sin ingeniería
  work:
    title: Cuatro iniciativas, una dirección.
    items:
      - mini: q
        title: ICA renewals workflow redesign
        text: Rediseñé el flujo de renovación de contratos ICA para Transaction Operations para reducir fricción, cuellos de botella y pasos innecesarios, y habilité renovaciones en paralelo. La ventana de renovación más corta evita renegociar términos y ahorra USD 400k por año.
        screen: ""
      - mini: notes
        title: Research de CRM “On behalf of”
        text: Research con 14 agentes y administrativos que mostró que los administrativos, no los agentes, son quienes más actúan en su nombre dentro del CRM, y que necesitan todo el historial de mails del agente. Los hallazgos pusieron una bandeja multicanal en el roadmap.
        screen: ""
      - mini: q
        title: Checklist Admin Tool v2
        text: Reconstruí como autoservicio una herramienta heredada con lógica hardcodeada para los Brokers of Record, con filtros dinámicos, edición masiva y un editor completo de ítems. En tests de usabilidad por escenarios logró una satisfacción UX de 4.8/5.
        screen: "[pantalla: editor de ítems del checklist]"
      - mini: sys
        title: Design system multimarca
        text: Extendí el design system existente de Compass con variables y tokens en Figma, para que una marca nueva cambie la piel del producto sin retrabajo manual en lugar de reconstruirlo. Las integraciones de marca pasaron a ser el doble de rápidas.
        screen: "[imagen: componentes del sistema]"
  reflection: "Rediseñar un workflow puntual, como la renovación de contratos ICA, puede tener un gran impacto en los costos de la empresa. Y extender el design system existente con tokens de marca permitió incorporar marcas nuevas bajo un mismo sistema."
  next: "medir la adopción del design system por marca y por equipo, para que su valor se vea en números y no solo en integraciones más rápidas."
  demo:
    c.try: Probalo
    c.try.h: Un sistema, cualquier marca.
    c.try.p: Elegí una marca. Los mismos componentes toman su color, forma y peso.
