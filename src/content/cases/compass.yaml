    c.bd.btn: New listing
    c.bd.note: Illustrative demo, not the real product.
    c.bd.live: applied

es:
  sector: PropTech
  years: 2024–2025
  summary: "Diseño a la escala de una empresa de USD 17B que crece por adquisiciones: operaciones de compliance, research de CRM y un design system que absorbe marcas nuevas."
  homeMetricLabel: de ahorro por año
  highlight: "USD 400k de ahorro anual · integración de marcas 2× más rápida"
  role: Senior product designer (lead individual contributor)
  scope: Automatización de contratos · Herramientas de compliance · Research de CRM · Design system
  team: Transaction Operations, Brokers of Record, producto e ingeniería
  timeline: Principios de 2024 – fines de 2025
  coverAlt: Portada del producto Compass
  metrics:
    - { value: "$400k", label: de ahorro anual con el flujo de renovación de contratos }
    - { value: "4.8/5", label: de satisfacción UX con la herramienta de checklists de compliance }
    - { value: "2×", label: más rápida la integración de marcas con el sistema multimarca }
  problem: Cada adquisición, de Christie’s a @properties, traía sus propias herramientas, marcas y pasos de compliance, y los cambios de rutina dependían de ingeniería.
  did: Automaticé la renovación de contratos, investigué cómo se trabaja en nombre de otros agentes, convertí la herramienta de checklists de compliance en autoservicio y armé un único design system para todas las marcas.
  result: "USD 400k de ahorro por año, cambios de compliance de rutina sin pasar por ingeniería y marcas nuevas integradas el doble de rápido."
  story:
    title: Del caos al orden.
    chapters:
      - kicker: Problema
        title: Crecer comprando, un producto a la vez.
        text: Christie’s, @properties y Washington Fine Properties llegaron cada una con sus herramientas, marcas y pasos de compliance. La operación escalaba, la experiencia se fragmentaba y cada cambio de compliance necesitaba a un ingeniero.
        data: → Una empresa de USD 17B construida a base de adquisiciones
      - kicker: Decisión
        title: Arreglar las bases compartidas, no cada pantalla.
        text: En lugar de rediseñar producto por producto, me enfoqué en lo que todas las marcas comparten — el flujo de contratos, las reglas de compliance detrás de cada operación y un design system como única fuente de verdad.
        data: → Un sistema para todas las marcas, con office hours de design system para los equipos
      - kicker: Resultado
        title: Las marcas nuevas encajan solas.
        text: Las renovaciones avanzan sin persecuciones manuales, los equipos de compliance actualizan sus propios checklists y cada adquisición se suma al sistema en vez de sumar ruido.
        data: → USD 400k de ahorro por año · 100% de los cambios de compliance de rutina sin ingeniería
  work:
    title: Cuatro iniciativas, una dirección.
    items:
      - mini: q
        title: Automatización del servicio de contratos
        text: Rediseñé el flujo de renovación de contratos del equipo de Transaction Operations y convertí los seguimientos manuales en un servicio automático que ahorra USD 400k por año.
        screen: "[pantalla: flujo de renovación de contratos]"
      - mini: notes
        title: Research de CRM “On behalf of”
        text: Research con 14 participantes sobre cómo asistentes y equipos actúan en nombre de los agentes dentro del CRM. Los hallazgos definieron el roadmap de una bandeja multicanal.
        screen: "[imagen: síntesis del research]"
      - mini: q
        title: Checklist Admin Tool v2
        text: Reconstruí una herramienta heredada para los Brokers of Record como autoservicio, con filtros dinámicos, edición masiva y un editor completo de ítems. Satisfacción UX de 4.8/5.
        screen: "[pantalla: editor de ítems del checklist]"
      - mini: sys
        title: Design system multimarca
        text: Variables y tokens en Figma como única fuente de verdad, para que una marca nueva cambie la piel del producto en lugar de reconstruirlo. Las integraciones de marca pasaron a ser el doble de rápidas.
        screen: "[imagen: componentes del sistema]"
  reflection: "[Qué me enseñó este proyecto, en una o dos frases.]"
  next: "[una línea]"
