en:
  sector: PropTech
  years: 2024–2025
  summary: "Design at the scale of a $17B company built on acquisitions: compliance operations, CRM research and an existing design system extended to absorb new brands."
  homeMetricLabel: saved per year
  highlight: "$400k saved per year · 2× faster brand integrations"
  role: Senior product designer (lead individual contributor)
  scope: Contract renewals · Compliance tools · CRM research · Design system
  team: Transaction Operations, Brokers of Record, product and engineering
  timeline: Early 2024 – Late 2025
  coverAlt: Compass product cover
  metrics:
    - { value: "$400k", label: annual savings from the contract renewal workflow }
    - { value: "4.8/5", label: UX satisfaction for the compliance checklist tool }
    - { value: "2×", label: faster brand integrations with the multi-brand system }
  problem: Every acquisition, from Christie’s to @properties, added a brand the design system wasn’t built to carry, while contract and compliance workflows were full of bottlenecks and unnecessary steps, and routine changes waited on engineering.
  did: Streamlined contract renewals, researched how administrative staff act on behalf of agents in the CRM, rebuilt the compliance checklist tool as self-service and extended the existing design system to support every brand.
  result: "$400k saved a year by shortening the renewal window, routine compliance updates with no engineering involved, and new brands integrated twice as fast."
  story:
    title: From scattered to aligned.
    chapters:
      - kicker: Problem
        title: The operation grew faster than its foundations.
        text: Christie’s, @properties and Washington Fine Properties each brought more agents, more transactions and a new brand. The infrastructure behind them wasn’t built for that scale, so every acquisition added friction.
        data: → A $17B company built on acquisitions
      - kicker: Decision
        title: Fix the shared foundations, not every screen.
        text: Instead of patching product by product, I worked on what every brand and every transaction runs on, so growth would stop costing more effort.
        data: → Four initiatives on the same foundations
      - kicker: Result
        title: Growth stopped creating friction.
        text: New brands plug into the system, renewals close on time and compliance teams work without waiting on engineering.
        data: → $400k saved per year · 100% of routine compliance updates without engineering
  work:
    title: Four initiatives, one direction.
    items:
      - mini: q
        title: ICA renewals workflow redesign
        text: Redesigned the ICA contract renewal workflow for Transaction Operations to cut friction, bottlenecks and unnecessary steps, and enabled concurrent renewals. The shorter renewal window prevents renegotiated terms and saves $400k a year.
        screen: ""
      - mini: notes
        title: CRM “On behalf of” research
        text: Research with 14 agents and administrative staff showed that admins, not agents, are the main users acting on their behalf in the CRM, and that they need the agent’s full email history. The findings put a multichannel inbox on the roadmap.
        screen: ""
      - mini: q
        title: Checklist Admin Tool v2
        text: Rebuilt a legacy tool with hardcoded logic as self-service for Brokers of Record, with dynamic filters, bulk editing and a full checklist item editor. Scenario-based usability tests scored UX satisfaction at 4.8/5.
        screen: "[screen: checklist item editor]"
      - mini: sys
        title: Multi-brand design system
        text: Extended Compass’s existing design system with Figma variables and tokens, so a new brand re-skins the product with no manual rework instead of rebuilding it. Brand integrations became twice as fast.
        screen: "[image: system components]"
  reflection: "Redesigning one specific workflow, like ICA contract renewals, can have a big impact on company costs. And extending the existing design system with brand tokens made it possible to onboard new brands under a single system."
  next: "Measure design system adoption by brand and team, so its value shows up in numbers, not only in faster integrations."
  demo:
    c.try: Try it
    c.try.h: One system, any brand.
    c.try.p: Pick a brand. The same components take its color, shape and weight.
    c.b1: Brand A
    c.b2: Brand B
    c.b3: Brand C
